[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somatic-lm"
dynamic = ["version"]
description = "A Python package for somatic language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bryan Briney" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "accelerate",
    "click",
    "einops",
    "hydra-core",
    "numpy",
    "omegaconf",
    "pandas",
    "pyarrow",
    "pyyaml",
    "rich",
    "safetensors",
    "tokenizers",
    # Upper bounds keep CI on the verified-good toolchain. transformers >=5.4 shifts
    # PretrainedConfig attribute typing, and torch 2.12 ships untested stubs; both
    # can make `ty check` report new diagnostics. Bump deliberately after re-running
    # `ty check src/` + the test suite.
    "torch<2.12",
    "transformers<5.4",
]

[project.optional-dependencies]
wandb = ["wandb"]
structures = ["biopython"]
probes = ["scikit-learn"]
all = ["wandb", "biopython", "scikit-learn"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    # ty is Astral's type checker (pre-1.0/beta). Pin an EXACT version: its
    # diagnostics shift between releases, so an unpinned range lets CI pull a newer
    # ty that flags code an older ty accepts. Bump deliberately. See
    # [tool.ty.environment] below.
    "ty==0.0.40",
]

[project.scripts]
somatic = "somatic.cli:main"

[project.urls]
Homepage = "https://github.com/briney/somatic"
Repository = "https://github.com/briney/somatic"

[tool.hatch.version]
path = "src/somatic/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/somatic"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["somatic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.environment]
python-version = "3.11"
