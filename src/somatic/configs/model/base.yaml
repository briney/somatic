vocab_size: 32
pad_token_id: 1

# "deep" variant
# 141M parameters (113M if standard MHA or shared QKV)
# width:depth ratio = 6
hidden_size: 384
num_hidden_layers: 64
num_attention_heads: 6
intermediate_size: null
ffn_multiplier: null

max_position_embeddings: 320

# Fraction of head_dim that gets RoPE.
# 1.0 = full RoPE (default); 0.0 = NoPE; values in between = partial RoPE
# (first rope_fraction of head_dim is rotated, remainder is un-rotated).
rope_fraction: 1.0

hidden_dropout: 0.1
attention_dropout: 0.1

use_chain_aware_attention: true
# Projection variant for chain-aware attention; ignored when
# use_chain_aware_attention=false. One of: "separate" (current default,
# separate Q/K/V per self/cross path) or "shared" (single shared Q/K/V).
chain_aware_projection_mode: separate

# Normalization options
norm_type: layernorm # "layernorm" or "rmsnorm"
norm_strategy: pre # "pre", "hybrid" (Zhuo et al., 2025), or "sandwich" (Ding et al., 2021)
qk_norm: none # "none", "norm", or "learned_scale"; ignored when norm_strategy: hybrid
norm_eps: 1e-6

# Gradient (activation) checkpointing: trades compute for activation memory.
gradient_checkpointing: false
gradient_checkpointing_mode: "full" # "full" | "selective" (selective requires torch>=2.4)


# alternative shape variants
#
# wide
# 142M params (113M with standard MHA or shared QKV)
# width:depth ratio =  48
# hidden_size: 768
# num_attention_heads: 12
# num_hidden_layers: 16
#
# standard
# 144M params (115M params with standard MHA or shared QKV)
# width:depth ratio = 14
# hidden_size: 512
# num_attention_heads: 8
# num_hidden_layers: 36
